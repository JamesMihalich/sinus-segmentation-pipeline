data_root: S:\Documents\Data\HC\HC_DS_Subsets\1-25-26-HC-Dataset
output_root: null
checkpoint_path: null
model:
  architecture: ResidualUnetSE3D
  in_channels: 1
  out_channels: 1
  base_channels: 16
  skip_mode: concat
  se_reduction_ratio: 8
training:
  patch_size:
  - 224
  - 224
  - 224
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 100
  num_workers: 4
  optimizer: AdamW
  gradient_clip_norm: 1.0
  scheduler: ReduceLROnPlateau
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_min_lr: 1.0e-06
  bce_weight: 0.5
  dice_weight: 0.5
  train_ratio: 0.75
  val_ratio: 0.15
  test_ratio: 0.1
  split_seed: 42
augmentation:
  flip_prob: 0.5
  rotate_prob: 0.4
  rotate_range:
  - -10.0
  - 10.0
  scale_prob: 0.2
  scale_range:
  - 0.95
  - 1.05
  noise_prob: 0.4
  noise_std: 0.05
  brightness_prob: 0.4
  brightness_range:
  - 0.9
  - 1.1
inference:
  patch_size:
  - 224
  - 224
  - 256
  overlap: 0.5
  threshold: 0.5
  apply_postprocessing: true
  keep_largest_component: true
preprocessing:
  window_level: -300.0
  window_width: 1000.0
  target_spacing:
  - 0.33
  - 0.33
  - 0.33
  crop_padding: 10
